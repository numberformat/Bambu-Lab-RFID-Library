name: RFID Library Integrity

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requirements
        run: python -m pip install -r requirements.txt

      - name: Compile Python tooling
        run: python -m compileall -q .

      - name: Run auditor tests
        run: python -m unittest discover -s tests -v

      - name: Run existing library checker
        run: python library_checker.py

      - name: Report full repository audit findings
        run: |
          if python audit_library.py; then
            echo "Repository audit completed without errors."
          else
            audit_status=$?
            if [ "$audit_status" -eq 1 ]; then
              echo "::warning::The audit found repository data errors; see the report above."
            else
              exit "$audit_status"
            fi
          fi
